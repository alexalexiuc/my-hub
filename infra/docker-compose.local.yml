services:
  # ---------------------------------------------------------------------------
  # MCP Server (Fastify) - local direct access (no Traefik)
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ..
      dockerfile: packages/mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MCP_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-myhub}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PAYLOADS: ${LOG_PAYLOADS:-false}
      PRINT_PAYLOADS: ${PRINT_PAYLOADS:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data/travel-documents:/app/data/travel-documents
    ports:
      - '3001:3001'

  # ---------------------------------------------------------------------------
  # Worker - local
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-myhub}}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # ---------------------------------------------------------------------------
  # Hub Panel (Next.js) - local direct access (no Traefik)
  # ---------------------------------------------------------------------------
  hub:
    build:
      context: ..
      dockerfile: packages/hub/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-myhub}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-myhub}}
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data/travel-documents:/app/data/travel-documents
    ports:
      - '3000:3000'
