services:
  # ---------------------------------------------------------------------------
  # MCP Server (Fastify) - local direct access (no Traefik)
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ..
      dockerfile: packages/mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MCP_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-myhub}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PAYLOADS: ${LOG_PAYLOADS:-false}
      PRINT_PAYLOADS: ${PRINT_PAYLOADS:-false}
      HUB_URL: ${HUB_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      # Notes MCP: Markdown repo on a volume + pgvector index + local embeddings (docs/notes-mcp-spec.md).
      NOTES_DATABASE_URL: postgresql://notes:${NOTES_DB_PASSWORD}@db:5432/notes
      NOTES_ROOT: /app/data/notes
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-e5}
      EMBEDDINGS_CACHE_DIR: /app/data/model-cache
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
    depends_on:
      # Not required: if db-init fails, the other MCP servers still start and notes tools return an error.
      db-init:
        condition: service_completed_successfully
        required: false
    # Mirrors the VPS so benchmark numbers from a dev box and from the server are comparable.
    cpus: ${MCP_CPUS:-2}
    mem_limit: ${MCP_MEM_LIMIT:-2g}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data/travel-documents:/app/data/travel-documents
      # Named volume, not a bind mount: it inherits the image's node-owned /app/data/notes, while a missing
      # ./data/notes bind directory would be created root-owned on Linux and fail the first write.
      - notes_data:/app/data/notes
      - notes_model_cache:/app/data/model-cache
    ports:
      - '3001:3001'

  # ---------------------------------------------------------------------------
  # Worker - local
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-myhub}}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      HUB_URL: ${HUB_URL:-http://localhost:3000}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # ---------------------------------------------------------------------------
  # Hub Panel (Next.js) - local direct access (no Traefik)
  # ---------------------------------------------------------------------------
  hub:
    build:
      context: ..
      dockerfile: packages/hub/Dockerfile
      args:
        NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-myhub}}
      HUB_URL: ${HUB_URL:-http://localhost:3000}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://localhost:3001}
      MCP_INTERNAL_URL: http://mcp:3001
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data/travel-documents:/app/data/travel-documents
    ports:
      - '3000:3000'

  # ---------------------------------------------------------------------------
  # PostgreSQL 18 (Alpine) + pgvector. The app DB itself is on the host here; this instance hosts the `notes` DB.
  # ---------------------------------------------------------------------------
  db:
    build:
      context: ./postgres
    image: my-hub-postgres:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432' # 5432 is the host's own Postgres; psql / bench against the local notes index
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myhub}
      POSTGRES_USER: ${POSTGRES_USER:-myhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-myhub} -d ${POSTGRES_DB:-myhub}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Creates the `notes` role + database in the main instance (idempotent), then exits.
  # ---------------------------------------------------------------------------
  db-init:
    image: my-hub-postgres:local
    restart: 'no'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:?NOTES_DB_PASSWORD is required}
    command:
      - sh
      - -c
      - psql -v ON_ERROR_STOP=1 -v notes_password="$$NOTES_DB_PASSWORD" -h db -U ${POSTGRES_USER:-myhub} -d ${POSTGRES_DB:-myhub} -f /usr/local/share/my-hub/init-notes-db.sql
    depends_on:
      db:
        condition: service_healthy

volumes:
  notes_data:
  db_data:
  notes_model_cache:
