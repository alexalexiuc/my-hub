services:
  # ---------------------------------------------------------------------------
  # Traefik v3 reverse proxy — shared across prod and staging stacks.
  # Run once on the server; both prod and staging connect via the external
  # "proxy" network this stack creates.
  #
  # Usage: docker compose -f infra/docker-compose.traefik.yml up -d
  # ---------------------------------------------------------------------------
  proxy:
    image: traefik:v3
    restart: unless-stopped
    command:
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/etc/traefik/acme
    networks:
      - proxy

volumes:
  # External volume: must be pre-created once with:
  #   docker volume create my-hub-traefik_traefik_acme
  # Protects Let's Encrypt certificates from being wiped on down -v.
  traefik_acme:
    external: true
    name: my-hub-traefik_traefik_acme

networks:
  proxy:
    name: proxy
    driver: bridge
