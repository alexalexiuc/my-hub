name: my-hub-prod

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myhub}
      POSTGRES_USER: ${POSTGRES_USER:-myhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-myhub} -d ${POSTGRES_DB:-myhub}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Notes index — PostgreSQL 18 + pgvector. Disposable: rebuilt from the Markdown files by `reindex`.
  # ---------------------------------------------------------------------------
  notes-db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${NOTES_DB_PASSWORD:?NOTES_DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - notes_db_data:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - '127.0.0.1:5433:5432' # loopback only: psql and the benchmarks on the VPS
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes -d notes']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # DB Migrations (Drizzle) — runs once per deploy then exits
  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-migrate:latest
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Worker — long-running background poller
  # ---------------------------------------------------------------------------
  worker:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-worker:latest
    restart: unless-stopped
    user: root # required to read Docker json-file logs from the mounted host directory (root:root 600)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      HUB_URL: ${HUB_URL:?HUB_URL is required}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      S3_LOGS_BUCKET: ${S3_LOGS_BUCKET:-}
      DOCKER_LOGS_DIR: /host/containers
      NOTES_DIR: /host/notes
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/lib/docker/containers:/host/containers:ro
      - notes_data:/host/notes:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------------------
  # MCP Server (Fastify) — pre-built image from GHCR
  # ---------------------------------------------------------------------------
  mcp:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-mcp-server:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MCP_HOST: 0.0.0.0
      # Host-header allowlist for /api/*/mcp (DNS-rebinding protection) — must match the Traefik rule below.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp.alexiuc.dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PAYLOADS: ${LOG_PAYLOADS:-false}
      PRINT_PAYLOADS: ${PRINT_PAYLOADS:-false}
      HUB_URL: ${HUB_URL:?HUB_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      # Notes MCP: Markdown repo on a volume + pgvector index + local embeddings (docs/notes-mcp-spec.md).
      NOTES_DATABASE_URL: postgresql://notes:${NOTES_DB_PASSWORD}@notes-db:5432/notes
      NOTES_ROOT: /app/data/notes
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-e5}
      EMBEDDINGS_CACHE_DIR: /app/data/model-cache
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
    depends_on:
      # Not required: if notes-db is down, the other MCP servers still start and notes tools return an error.
      notes-db:
        condition: service_healthy
        required: false
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Hub is the only writer (uploads); MCP only reads. `nocopy` stops MCP from
      # populating a fresh volume, so its ownership always comes from the hub image
      # (uid 1001) regardless of which container starts first. Otherwise an MCP-first
      # start leaves the directory owned by uid 1000 and hub uploads fail with EACCES.
      - type: volume
        source: travel_docs_data
        target: /app/data/travel-documents
        read_only: true
        volume:
          nocopy: true
      - notes_data:/app/data/notes
      - notes_model_cache:/app/data/model-cache
    # Mirrors the VPS so benchmark numbers from a dev box and from the server are comparable.
    cpus: ${MCP_CPUS:-2}
    mem_limit: ${MCP_MEM_LIMIT:-2g}
    networks:
      - internal
      - proxy
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.mcp.rule=Host(`mcp.alexiuc.dev`)'
      - 'traefik.http.routers.mcp.entrypoints=websecure'
      - 'traefik.http.routers.mcp.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.mcp.middlewares=secure-headers@file,rate-limit@file'
      - 'traefik.http.services.mcp.loadbalancer.server.port=3001'

  # ---------------------------------------------------------------------------
  # Hub Panel (Next.js) — pre-built image from GHCR
  # ---------------------------------------------------------------------------
  hub:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-hub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HUB_URL: ${HUB_URL:?HUB_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:?NEXT_PUBLIC_MCP_URL is required}
      MCP_INTERNAL_URL: http://mcp:3001
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - travel_docs_data:/app/data/travel-documents
    networks:
      - internal
      - proxy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.hub.rule=Host(`hub.alexiuc.dev`)'
      - 'traefik.http.routers.hub.entrypoints=websecure'
      - 'traefik.http.routers.hub.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.hub.middlewares=secure-headers@file,rate-limit@file'
      - 'traefik.http.services.hub.loadbalancer.server.port=3000'

volumes:
  # External volume: must be pre-created once with:
  #   docker volume create my-hub_db_data
  # Docker Compose will never create or delete it (down -v is safe).
  # The explicit name makes it immune to --project-name changes.
  db_data:
    external: true
    name: my-hub_db_data
  travel_docs_data:
    external: false
  # Notes Markdown repo: the source of truth for notes. External so `down -v` can never delete it; create once with
  #   docker volume create my-hub_notes_data
  notes_data:
    external: true
    name: my-hub_notes_data
  # Disposable: the search index (rebuilt by reindex) and the downloaded embedding model.
  notes_db_data:
  notes_model_cache:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: proxy
