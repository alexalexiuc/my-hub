# Staging environment — standalone, not an overlay.
# Usage: docker compose --env-file .env.staging \
#          -f infra/docker-compose.staging.yml up -d --build
# Prerequisite: Traefik running via docker-compose.traefik.yml (creates the proxy network)

name: my-hub-staging

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 — staging database (isolated volume + network)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myhub_staging}
      POSTGRES_USER: ${POSTGRES_USER:-myhub_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_staging_data:/var/lib/postgresql/data
    networks:
      - internal-staging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-myhub_staging} -d ${POSTGRES_DB:-myhub_staging}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # DB Migrations (Drizzle) — runs once per deploy then exits
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: packages/shared/Dockerfile.migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-staging

  # ---------------------------------------------------------------------------
  # MCP Server (Fastify) — built from source
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ..
      dockerfile: packages/mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PAYLOADS: ${LOG_PAYLOADS:-false}
      PRINT_PAYLOADS: ${PRINT_PAYLOADS:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://staging.hub.alexiuc.dev}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal-staging
      - proxy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.mcp-staging.rule=Host(`staging.mcp.alexiuc.dev`)'
      - 'traefik.http.routers.mcp-staging.entrypoints=websecure'
      - 'traefik.http.routers.mcp-staging.tls.certresolver=letsencrypt'
      - 'traefik.http.services.mcp-staging.loadbalancer.server.port=3001'

  # ---------------------------------------------------------------------------
  # Hub Panel (Next.js) — built from source
  # ---------------------------------------------------------------------------
  hub:
    build:
      context: ..
      dockerfile: packages/hub/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://staging.hub.alexiuc.dev}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal-staging
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.hub-staging.rule=Host(`staging.hub.alexiuc.dev`)'
      - 'traefik.http.routers.hub-staging.entrypoints=websecure'
      - 'traefik.http.routers.hub-staging.tls.certresolver=letsencrypt'
      - 'traefik.http.services.hub-staging.loadbalancer.server.port=3000'

volumes:
  db_staging_data:

networks:
  internal-staging:
    driver: bridge
  proxy:
    external: true
    name: proxy
