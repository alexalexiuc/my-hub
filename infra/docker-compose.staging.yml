# Staging environment — standalone, not an overlay.
# Usage: IMAGE_OWNER=<owner> docker compose --env-file .env.staging \
#          -f infra/docker-compose.staging.yml pull && up -d
# Images are pre-built and pushed to GHCR by CI (e2e.yml build-and-push job).
# Prerequisite: Traefik running via docker-compose.traefik.yml (creates the proxy network)

name: my-hub-staging

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 — staging database (isolated volume + network)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myhub_staging}
      POSTGRES_USER: ${POSTGRES_USER:-myhub_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - /var/lib/postgresql/data
    networks:
      - internal-staging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-myhub_staging} -d ${POSTGRES_DB:-myhub_staging}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # DB Migrations (Drizzle) — runs once per deploy then exits
  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-migrate:staging-latest
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-staging

  # ---------------------------------------------------------------------------
  # E2E Seeds (packages/e2e) — runs once per deploy then exits
  # ---------------------------------------------------------------------------
  e2e-seeds:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-e2e-seeds:staging-latest
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
      E2E_HUB_USER_EMAIL: ${E2E_HUB_USER_EMAIL:?E2E_HUB_USER_EMAIL is required}
      E2E_HUB_USER_PASSWORD: ${E2E_HUB_USER_PASSWORD:?E2E_HUB_USER_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal-staging

  # ---------------------------------------------------------------------------
  # Worker — long-running background poller
  # ---------------------------------------------------------------------------
  worker:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-worker:staging-latest
    restart: unless-stopped
    user: root # required to read Docker json-file logs from the mounted host directory (root:root 600)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      HUB_URL: ${HUB_URL:?HUB_URL is required}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      S3_LOGS_BUCKET: ${S3_LOGS_BUCKET:-}
      DOCKER_LOGS_DIR: /host/containers
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/lib/docker/containers:/host/containers:ro
    networks:
      - internal-staging
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------------------------------------------------
  # MCP Server (Fastify) — pre-built image from GHCR
  # ---------------------------------------------------------------------------
  mcp:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-mcp-server:staging-latest
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3001
      MCP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PAYLOADS: ${LOG_PAYLOADS:-false}
      PRINT_PAYLOADS: ${PRINT_PAYLOADS:-false}
      HUB_URL: ${HUB_URL:?HUB_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-}
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - travel_docs_data:/app/data/travel-documents
    networks:
      - internal-staging
      - proxy
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.mcp-staging.rule=Host(`staging.mcp.alexiuc.dev`)'
      - 'traefik.http.routers.mcp-staging.entrypoints=websecure'
      - 'traefik.http.routers.mcp-staging.tls.certresolver=letsencrypt'
      - 'traefik.http.services.mcp-staging.loadbalancer.server.port=3001'

  # ---------------------------------------------------------------------------
  # Hub Panel (Next.js) — pre-built image from GHCR
  # ---------------------------------------------------------------------------
  hub:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/my-hub-hub:staging-latest
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'node packages/hub/scripts/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      HUB_URL: ${HUB_URL:?HUB_URL is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-myhub_staging}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myhub_staging}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:?NEXT_PUBLIC_MCP_URL is required}
      TRAVEL_FILES_ROOT: ${TRAVEL_FILES_ROOT:-/app/data/travel-documents}
      TRAVEL_FILES_MAX_MB: ${TRAVEL_FILES_MAX_MB:-15}
      TRAVEL_FILES_ALLOWED_MIME: ${TRAVEL_FILES_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,image/webp}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:?SES_FROM_EMAIL is required}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - travel_docs_data:/app/data/travel-documents
    networks:
      - internal-staging
      - proxy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.hub-staging.rule=Host(`staging.hub.alexiuc.dev`)'
      - 'traefik.http.routers.hub-staging.entrypoints=websecure'
      - 'traefik.http.routers.hub-staging.tls.certresolver=letsencrypt'
      - 'traefik.http.services.hub-staging.loadbalancer.server.port=3000'

volumes:
  travel_docs_data:

networks:
  internal-staging:
    driver: bridge
  proxy:
    external: true
    name: proxy
