name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      mcp_image: ${{ steps.meta-mcp.outputs.tags }}
      hub_image: ${{ steps.meta-hub.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- migrate ----
      - name: Docker meta — migrate
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-migrate
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & push — migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/shared/Dockerfile.migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- mcp-server ----
      - name: Docker meta — mcp-server
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-mcp-server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & push — mcp-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- hub ----
      - name: Docker meta — hub
        id: meta-hub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-hub
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & push — hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/hub/Dockerfile
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-hub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH deploy to production VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/my-hub
            git fetch origin main
            git reset --hard origin/main
            docker compose --project-name my-hub-traefik -f infra/docker-compose.traefik.yml up -d
            IMAGE_OWNER=${{ env.IMAGE_OWNER }} docker compose --project-name my-hub --env-file .env -f infra/docker-compose.prod.yml pull
            IMAGE_OWNER=${{ env.IMAGE_OWNER }} docker compose --project-name my-hub --env-file .env -f infra/docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
