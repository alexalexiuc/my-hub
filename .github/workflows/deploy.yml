name: Deploy

on:
  push:
    branches: [main]

# Deploys run one at a time, in order; a newer push waits rather than cancelling a
# deploy that is mid-way through `docker compose up`.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # All production images in one bake run: parallel targets, a shared install/build
      # prefix that runs once, and a per-image layer cache. See docker-bake.hcl.
      - name: Build & push images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: prod
          push: true
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub
          TAG: latest
          SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          GHA_CACHE: '1'

  deploy:
    name: SSH deploy to production VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      # No checkout: the script runs on the VPS against its own clone.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/my-hub
            git fetch origin main
            git reset --hard origin/main
            docker compose --project-name my-hub-traefik -f infra/docker-compose.traefik.yml up -d
            IMAGE_OWNER=${{ env.IMAGE_OWNER }} docker compose --project-name my-hub --env-file .env -f infra/docker-compose.prod.yml pull
            IMAGE_OWNER=${{ env.IMAGE_OWNER }} docker compose --project-name my-hub --env-file .env -f infra/docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
