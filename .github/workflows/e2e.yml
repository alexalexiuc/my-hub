name: E2E Tests

on:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push staging images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- migrate ----
      - name: Docker meta — migrate
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-migrate
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/shared/Dockerfile.migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- e2e-seeds ----
      - name: Docker meta — e2e-seeds
        id: meta-e2e-seeds
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-e2e-seeds
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — e2e-seeds
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/e2e/Dockerfile
          push: true
          tags: ${{ steps.meta-e2e-seeds.outputs.tags }}
          labels: ${{ steps.meta-e2e-seeds.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- mcp-server ----
      - name: Docker meta — mcp-server
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-mcp-server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — mcp-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- hub ----
      - name: Docker meta — hub
        id: meta-hub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-hub
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/hub/Dockerfile
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-hub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- worker ----
      - name: Docker meta — worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-worker
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2EExpected
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @my-hub/e2e exec playwright install --with-deps chromium

      - name: Generate E2E credentials
        id: creds
        run: |
          CLIENT_ID="hub_$(openssl rand -hex 4)"
          CLIENT_SECRET=$(uuidgen)
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "client_secret=$CLIENT_SECRET" >> $GITHUB_OUTPUT
          echo "E2E_MCP_CLIENT_ID=$CLIENT_ID" > packages/mcp-server/e2e/.env.e2e
          echo "E2E_MCP_CLIENT_SECRET=$CLIENT_SECRET" >> packages/mcp-server/e2e/.env.e2e

      - name: Deploy staging stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_OWNER,DEPLOY_BRANCH
          script_stop: true
          script: |
            set -e
            cd /opt/my-hub
            git fetch origin "$DEPLOY_BRANCH"
            git show "origin/$DEPLOY_BRANCH:infra/docker-compose.staging.yml" > infra/docker-compose.staging.yml
            docker compose --project-name my-hub-traefik -f infra/docker-compose.traefik.yml up -d
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml pull
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml up -d --wait
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          DEPLOY_BRANCH: ${{ github.head_ref }}

      - name: Provision E2E user on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: E2E_MCP_CLIENT_ID,E2E_MCP_CLIENT_SECRET,E2E_HUB_USER_EMAIL,IMAGE_OWNER
          script: |
            cd /opt/my-hub
            docker compose --project-name my-hub-staging \
              -f infra/docker-compose.staging.yml exec -T \
              -e E2E_MCP_CLIENT_ID=$E2E_MCP_CLIENT_ID \
              -e E2E_MCP_CLIENT_SECRET=$E2E_MCP_CLIENT_SECRET \
              -e E2E_HUB_USER_EMAIL=$E2E_HUB_USER_EMAIL \
              mcp node /app/dist/e2e-setup.js
        env:
          E2E_MCP_CLIENT_ID: ${{ steps.creds.outputs.client_id }}
          E2E_MCP_CLIENT_SECRET: ${{ steps.creds.outputs.client_secret }}
          E2E_HUB_USER_EMAIL: ${{ vars.E2E_HUB_USER_EMAIL }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_MCP_BASE_URL: https://staging.mcp.alexiuc.dev
          NEXT_PUBLIC_MCP_URL: https://staging.mcp.alexiuc.dev
          E2E_MCP_USER_EMAIL: ${{ vars.E2E_MCP_USER_EMAIL }}

          E2E_HUB_BASE_URL: https://staging.hub.alexiuc.dev
          E2E_HUB_USER_EMAIL: ${{ vars.E2E_HUB_USER_EMAIL }}
          E2E_HUB_USER_PASSWORD: ${{ secrets.E2E_HUB_USER_PASSWORD }}

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7

      - name: Cleanup staging stack
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_OWNER
          script_stop: true
          script: |
            set -e
            cd /opt/my-hub
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml down -v
            docker image prune -f
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
