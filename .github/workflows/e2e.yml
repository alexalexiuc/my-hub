name: E2E Tests

on:
  # Run automatically after CI passes on a PR targeting main
  workflow_run:
    workflows: [CI]
    types: [completed]

  # Allow manual runs targeting any environment
  workflow_dispatch:
    inputs:
      base_url:
        description: 'MCP server base URL (leave blank to use https://staging.mcp.alexiuc.dev)'
        required: false
        type: string
      hub_base_url:
        description: 'Hub base URL (leave blank to use https://staging.hub.alexiuc.dev)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push staging images to GHCR
    runs-on: ubuntu-latest
    # For workflow_run trigger: only run when CI passed on a PR targeting main
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].base.ref == 'main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- migrate ----
      - name: Docker meta — migrate
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-migrate
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/shared/Dockerfile.migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- mcp-server ----
      - name: Docker meta — mcp-server
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-mcp-server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — mcp-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- hub ----
      - name: Docker meta — hub
        id: meta-hub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub-hub
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build & push — hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/hub/Dockerfile
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-hub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @my-hub/e2e exec playwright install --with-deps chromium

      - name: Generate E2E credentials
        id: creds
        run: |
          CLIENT_ID="hub_$(openssl rand -hex 4)"
          CLIENT_SECRET=$(uuidgen)
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "client_secret=$CLIENT_SECRET" >> $GITHUB_OUTPUT
          echo "E2E_MCP_CLIENT_ID=$CLIENT_ID" > packages/mcp-server/e2e/.env.e2e
          echo "E2E_MCP_CLIENT_SECRET=$CLIENT_SECRET" >> packages/mcp-server/e2e/.env.e2e

      - name: Resolve deployment branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            echo "name=${BRANCH:-main}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy staging stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_OWNER,DEPLOY_BRANCH
          script_stop: true
          script: |
            set -e
            cd /opt/my-hub
            git fetch origin "$DEPLOY_BRANCH"
            git show "origin/$DEPLOY_BRANCH:infra/docker-compose.staging.yml" > infra/docker-compose.staging.yml
            docker compose --project-name my-hub-traefik -f infra/docker-compose.traefik.yml up -d
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml pull
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml up -d --wait
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}

      - name: Provision E2E user on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: E2E_MCP_CLIENT_ID,E2E_MCP_CLIENT_SECRET,IMAGE_OWNER
          script: |
            cd /opt/my-hub
            docker compose --project-name my-hub-staging \
              -f infra/docker-compose.staging.yml exec -T \
              -e E2E_MCP_CLIENT_ID=$E2E_MCP_CLIENT_ID \
              -e E2E_MCP_CLIENT_SECRET=$E2E_MCP_CLIENT_SECRET \
              mcp node /app/dist/e2e-setup.js
        env:
          E2E_MCP_CLIENT_ID: ${{ steps.creds.outputs.client_id }}
          E2E_MCP_CLIENT_SECRET: ${{ steps.creds.outputs.client_secret }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_MCP_BASE_URL: ${{ inputs.base_url || 'https://staging.mcp.alexiuc.dev' }}
          E2E_MCP_USER_EMAIL: ${{ vars.E2E_MCP_USER_EMAIL }}

          E2E_HUB_BASE_URL: ${{ inputs.hub_base_url || 'https://staging.hub.alexiuc.dev' }}
          E2E_HUB_USER_EMAIL: ${{ vars.E2E_HUB_USER_EMAIL }}
          E2E_HUB_USER_PASSWORD: ${{ secrets.E2E_HUB_USER_PASSWORD }}

      - name: Cleanup staging stack
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_OWNER
          script_stop: true
          script: |
            set -e
            cd /opt/my-hub
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml down -v
            docker image prune -f
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
