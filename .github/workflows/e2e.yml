name: E2E Tests

on:
  pull_request:
    branches: [main]

# A new push to the PR supersedes the run in progress. The e2e job additionally
# serialises on the shared staging stack (see its concurrency block).
concurrency:
  group: e2e-${{ github.head_ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push staging images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # All staging images in one bake run: parallel targets, a shared install/build
      # prefix that runs once, and a per-image layer cache. See docker-bake.hcl.
      - name: Build & push staging images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: staging
          push: true
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-hub
          TAG: staging-latest
          SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          GHA_CACHE: '1'

  e2e:
    name: E2EExpected
    runs-on: ubuntu-latest
    needs: build-and-push
    # There is one staging stack on the VPS: two PRs must not deploy/test/tear it down
    # at the same time. GitHub holds at most one waiting job per group, so with three
    # PRs in flight the middle one's pending job is cancelled and needs a re-run —
    # still better than two runs interleaving on the same stack.
    concurrency:
      group: staging-stack
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # No explicit version: pnpm/action-setup reads the pinned version from the
        # "packageManager" field in package.json, matching what Docker's `corepack enable`
        # resolves in the deploy images. Keeping a hardcoded version here silently drifts
        # from package.json and breaks lockfile compatibility (see pnpm-lock.yaml history).
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @my-hub/shared build

      # Browsers are cached per pinned Playwright version; only the OS packages are
      # installed on a cache hit. Tests run headless, so the headless shell is enough.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/e2e/package.json') }}

      - name: Install Playwright browsers
        run: pnpm --filter @my-hub/e2e exec playwright install --with-deps --only-shell chromium

      - name: Generate E2E credentials
        id: creds
        run: |
          CLIENT_ID="hub_$(openssl rand -hex 4)"
          CLIENT_SECRET=$(uuidgen)
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "client_secret=$CLIENT_SECRET" >> $GITHUB_OUTPUT
          echo "E2E_MCP_CLIENT_ID=$CLIENT_ID" > packages/mcp-server/e2e/.env.e2e
          echo "E2E_MCP_CLIENT_SECRET=$CLIENT_SECRET" >> packages/mcp-server/e2e/.env.e2e

      - name: Resolve image tag
        id: image
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy staging stack
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_OWNER,IMAGE_TAG,DEPLOY_BRANCH
          script: |
            set -e
            cd /opt/my-hub
            git fetch origin "$DEPLOY_BRANCH"
            git show "origin/$DEPLOY_BRANCH:infra/docker-compose.staging.yml" > infra/docker-compose.staging.yml
            docker compose --project-name my-hub-traefik -f infra/docker-compose.traefik.yml up -d
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml pull
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml up -d --wait
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          # This run's own images (docker-bake.hcl's sha tag), not the shared staging-latest.
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DEPLOY_BRANCH: ${{ github.head_ref }}

      - name: Provision E2E user on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: E2E_MCP_CLIENT_ID,E2E_MCP_CLIENT_SECRET,E2E_HUB_USER_EMAIL,IMAGE_OWNER
          script: |
            set -e
            cd /opt/my-hub
            docker compose --project-name my-hub-staging \
              -f infra/docker-compose.staging.yml exec -T \
              -e E2E_MCP_CLIENT_ID=$E2E_MCP_CLIENT_ID \
              -e E2E_MCP_CLIENT_SECRET=$E2E_MCP_CLIENT_SECRET \
              -e E2E_HUB_USER_EMAIL=$E2E_HUB_USER_EMAIL \
              mcp node /app/dist/e2e-setup.js
        env:
          E2E_MCP_CLIENT_ID: ${{ steps.creds.outputs.client_id }}
          E2E_MCP_CLIENT_SECRET: ${{ steps.creds.outputs.client_secret }}
          E2E_HUB_USER_EMAIL: ${{ vars.E2E_HUB_USER_EMAIL }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_MCP_BASE_URL: https://staging.mcp.alexiuc.dev
          NEXT_PUBLIC_MCP_URL: https://staging.mcp.alexiuc.dev
          E2E_MCP_USER_EMAIL: ${{ vars.E2E_MCP_USER_EMAIL }}

          E2E_HUB_BASE_URL: https://staging.hub.alexiuc.dev
          E2E_HUB_USER_EMAIL: ${{ vars.E2E_HUB_USER_EMAIL }}
          E2E_HUB_USER_PASSWORD: ${{ secrets.E2E_HUB_USER_PASSWORD }}

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7

      - name: Cleanup staging stack
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_OWNER,IMAGE_TAG
          script: |
            set -e
            cd /opt/my-hub
            docker compose --project-name my-hub-staging --env-file .env.staging \
              -f infra/docker-compose.staging.yml down -v
            # This run's sha-tagged images stay tagged after `down`, so `image prune`
            # alone would never reclaim them. Untag them (no -f: an image still tagged
            # elsewhere, e.g. by production, is kept), then prune dangling layers.
            for name in migrate e2e-seeds worker mcp-server hub; do
              docker image rm "ghcr.io/$IMAGE_OWNER/my-hub-$name:$IMAGE_TAG" 2>/dev/null || true
            done
            docker image prune -f
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
